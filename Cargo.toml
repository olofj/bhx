[package]
name = "tt-bh-linux"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["slirp", "virtio-engine"]
slirp = [] # Links libvdeslirp/libslirp for network device support
# Route the L2CPU's virtio-mmio reg windows through a Tensix tile
# running the BRISC firmware (#69 M3 + #71 M5.5) instead of the
# host-buffer DMA path (#64). Default-on as of M5.5e — full Linux
# (block + net + rng + console) boots end-to-end through the engine,
# closing the SEL multiplexing race that #58/#61/#63/#65 surfaced
# for the host-buffer path. The legacy host-buffer code is still in
# the tree behind `--no-default-features --features slirp` so the
# soak scripts can pin against it during the M6 cutover.
virtio-engine = []

[dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["ioctl", "mman", "fs", "term", "signal", "uio", "socket"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Crate-level structured error type. See src/error.rs and #21.
thiserror = "2"

# Sandbox crates (Linux-only). seccompiler builds + installs BPF
# syscall filters; landlock restricts filesystem reach. Both are
# small, no transitive deps that pull in C++. See docs/sandbox-
# syscalls.md and src/daemon/sandbox.rs.
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
landlock = "0.4"

[dev-dependencies]
tempfile = "3"

# Profiling-friendly opt build. Use as:
#   cargo build --profile profiling
# Produces target/profiling/tt-bh-linux with full debug info so samply
# / perf can resolve symbols and frame pointers, while still running
# release-grade optimized code. See scripts/profile_daemon.sh.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[build-dependencies]
