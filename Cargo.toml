[package]
name = "bhx"
version = "0.9.0"
edition = "2021"
license = "MIT"
authors = ["Olof Johansson <olof.johansson@gmail.com>"]
description = "Boot Linux on Tenstorrent Blackhole's on-chip RISC-V cores."
repository = "https://github.com/olofj/bhx"
readme = "README.md"
keywords = ["riscv", "tenstorrent", "blackhole", "virtio", "u-boot"]
categories = ["command-line-utilities", "virtualization"]

[features]
default = ["slirp"]
slirp = [] # Links libvdeslirp/libslirp for network device support

[dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["ioctl", "mman", "fs", "term", "signal", "uio", "socket"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Crate-level structured error type. See src/error.rs and #21.
thiserror = "2"
# Native HTTP client used by `bhx image pull` / `bhx ramdisk pull`.
# rustls-only TLS to avoid pulling in OpenSSL. See src/fetch.rs and #87.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# YAML loader for `~/.config/bhx/profiles.yaml` (#92). serde_yaml_ng is the
# actively-maintained fork of dtolnay/serde_yaml (deprecated in 2024).
serde_yaml_ng = "0.10"
# Race-free named temp files. Used by `bhx profile edit/add` (#112) to
# stage editor I/O so a Ctrl-C at the visudo-style retry prompt leaves
# the canonical catalog untouched, and by tests for sandbox/runtime
# fixtures.
tempfile = "3"

# Sandbox crates (Linux-only). seccompiler builds + installs BPF
# syscall filters; landlock restricts filesystem reach. Both are
# small, no transitive deps that pull in C++. See docs/sandbox-
# syscalls.md and src/daemon/sandbox.rs.
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
landlock = "0.4"

# Profiling-friendly opt build. Use as:
#   cargo build --profile profiling
# Produces target/profiling/bhx with full debug info so samply
# / perf can resolve symbols and frame pointers, while still running
# release-grade optimized code. See scripts/profile_daemon.sh.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[build-dependencies]
# Compile the small C shim in src/slirp_set_hostname.c that pokes
# `vhostname` into libslirp's opaque-from-Rust SlirpConfig (#60).
cc = "1"
