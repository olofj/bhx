[package]
name = "tt-bh-linux"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["slirp"]
slirp = [] # Links libvdeslirp/libslirp for network device support
# Route the L2CPU's virtio-mmio reg windows through a Tensix tile
# running the M3 BRISC firmware (#69) instead of the host-buffer
# DMA path (#64). Off by default for M4 (#70) — flips on once the
# daemon-side bridge in M5 (#71) is also wired up. Toggling the flag
# rebuilds the daemon; you can run both paths side-by-side by
# rebuilding without the flag.
virtio-engine = []

[dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["ioctl", "mman", "fs", "term", "signal", "uio", "socket"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Crate-level structured error type. See src/error.rs and #21.
thiserror = "2"

# Sandbox crates (Linux-only). seccompiler builds + installs BPF
# syscall filters; landlock restricts filesystem reach. Both are
# small, no transitive deps that pull in C++. See docs/sandbox-
# syscalls.md and src/daemon/sandbox.rs.
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
landlock = "0.4"

[dev-dependencies]
tempfile = "3"

# Profiling-friendly opt build. Use as:
#   cargo build --profile profiling
# Produces target/profiling/tt-bh-linux with full debug info so samply
# / perf can resolve symbols and frame pointers, while still running
# release-grade optimized code. See scripts/profile_daemon.sh.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[build-dependencies]
