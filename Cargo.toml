[package]
name = "tt-bh-linux"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["slirp"]
slirp = [] # Links libvdeslirp/libslirp for network device support

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["ioctl", "mman", "fs", "term", "signal"] }
clap = { version = "4", features = ["derive"] }

[build-dependencies]
