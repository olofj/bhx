[package]
name = "tt-bh-linux"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["slirp"]
slirp = [] # Links libvdeslirp/libslirp for network device support

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["ioctl", "mman", "fs", "term", "signal", "uio", "socket"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
daemonize = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
